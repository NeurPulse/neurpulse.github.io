<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 841" role="img" aria-labelledby="title desc"><title id="title">从预测到备货</title><desc id="desc">预测误差与经营损失是不同的评价。；训练 112 天：拟合均值、星期基线和回归模型；验证 28 天：选择模型，再用前 140 天重训；校准 28 天：冻结模型，估计未见数据的残差；构造需求情景：点预测加残差，保留需求不确定性；选择整数备货 Q：最小化缺货与剩余的期望损失；测试 42 天：冻结规则，报告利润、缺货和剩余</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#327080"/></marker></defs><rect width="520" height="841" fill="#f6f8fa" rx="16"/><g font-family="Microsoft YaHei, sans-serif"><text x="28" y="43" font-size="24" font-weight="700" fill="#173b55">从预测到备货</text><text x="28" y="76" font-size="17" fill="#466273">预测误差与经营损失是不同的评价。</text><rect x="28" y="105" width="464" height="86" rx="10" fill="#fff" stroke="#bdd0d9"/><text x="48" y="137" font-size="22" font-weight="600" fill="#173b55">训练 112 天</text><text x="48" y="167" font-size="17" fill="#355260">拟合均值、星期基线和回归模型</text><path d="M260 193V214" stroke="#327080" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="221" width="464" height="86" rx="10" fill="#e7f1f1" stroke="#bdd0d9"/><text x="48" y="253" font-size="22" font-weight="600" fill="#173b55">验证 28 天</text><text x="48" y="283" font-size="17" fill="#355260">选择模型，再用前 140 天重训</text><path d="M260 309V330" stroke="#327080" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="337" width="464" height="86" rx="10" fill="#fff" stroke="#bdd0d9"/><text x="48" y="369" font-size="22" font-weight="600" fill="#173b55">校准 28 天</text><text x="48" y="399" font-size="17" fill="#355260">冻结模型，估计未见数据的残差</text><path d="M260 425V446" stroke="#327080" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="453" width="464" height="86" rx="10" fill="#e7f1f1" stroke="#bdd0d9"/><text x="48" y="485" font-size="22" font-weight="600" fill="#173b55">构造需求情景</text><text x="48" y="515" font-size="17" fill="#355260">点预测加残差，保留需求不确定性</text><path d="M260 541V562" stroke="#327080" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="569" width="464" height="86" rx="10" fill="#fff" stroke="#bdd0d9"/><text x="48" y="601" font-size="22" font-weight="600" fill="#173b55">选择整数备货 Q</text><text x="48" y="631" font-size="17" fill="#355260">最小化缺货与剩余的期望损失</text><path d="M260 657V678" stroke="#327080" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="685" width="464" height="86" rx="10" fill="#e7f1f1" stroke="#bdd0d9"/><text x="48" y="717" font-size="22" font-weight="600" fill="#173b55">测试 42 天</text><text x="48" y="747" font-size="17" fill="#355260">冻结规则，报告利润、缺货和剩余</text></g></svg>