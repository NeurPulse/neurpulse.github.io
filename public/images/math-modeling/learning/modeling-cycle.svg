<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 841" role="img" aria-labelledby="title desc"><title id="title">从问题到可检验的建议</title><desc id="desc">验证不通过时，回到假设、数据或模型。；1 明确问题：输出是什么，给谁使用，何时决策；2 定义变量与假设：参数、决策量、单位、可用信息；3 建立关系：方程、概率、目标和约束；4 求解与独立核对：手算、小规模枚举、标准算法；5 验证与敏感性分析：新数据、基线、误差、参数变化；6 解释建议：方案、证据、适用条件与局限</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#327080"/></marker></defs><rect width="520" height="841" fill="#f6f8fa" rx="16"/><g font-family="Microsoft YaHei, sans-serif"><text x="28" y="43" font-size="24" font-weight="700" fill="#173b55">从问题到可检验的建议</text><text x="28" y="76" font-size="17" fill="#466273">验证不通过时，回到假设、数据或模型。</text><rect x="28" y="105" width="464" height="86" rx="10" fill="#fff" stroke="#bdd0d9"/><text x="48" y="137" font-size="22" font-weight="600" fill="#173b55">1 明确问题</text><text x="48" y="167" font-size="17" fill="#355260">输出是什么，给谁使用，何时决策</text><path d="M260 193V214" stroke="#327080" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="221" width="464" height="86" rx="10" fill="#e7f1f1" stroke="#bdd0d9"/><text x="48" y="253" font-size="22" font-weight="600" fill="#173b55">2 定义变量与假设</text><text x="48" y="283" font-size="17" fill="#355260">参数、决策量、单位、可用信息</text><path d="M260 309V330" stroke="#327080" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="337" width="464" height="86" rx="10" fill="#fff" stroke="#bdd0d9"/><text x="48" y="369" font-size="22" font-weight="600" fill="#173b55">3 建立关系</text><text x="48" y="399" font-size="17" fill="#355260">方程、概率、目标和约束</text><path d="M260 425V446" stroke="#327080" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="453" width="464" height="86" rx="10" fill="#e7f1f1" stroke="#bdd0d9"/><text x="48" y="485" font-size="22" font-weight="600" fill="#173b55">4 求解与独立核对</text><text x="48" y="515" font-size="17" fill="#355260">手算、小规模枚举、标准算法</text><path d="M260 541V562" stroke="#327080" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="569" width="464" height="86" rx="10" fill="#fff" stroke="#bdd0d9"/><text x="48" y="601" font-size="22" font-weight="600" fill="#173b55">5 验证与敏感性分析</text><text x="48" y="631" font-size="17" fill="#355260">新数据、基线、误差、参数变化</text><path d="M260 657V678" stroke="#327080" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="685" width="464" height="86" rx="10" fill="#e7f1f1" stroke="#bdd0d9"/><text x="48" y="717" font-size="22" font-weight="600" fill="#173b55">6 解释建议</text><text x="48" y="747" font-size="17" fill="#355260">方案、证据、适用条件与局限</text></g></svg>