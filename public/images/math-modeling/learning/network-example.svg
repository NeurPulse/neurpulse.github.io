<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 450" role="img" aria-labelledby="title desc"><title id="title">五节点配送网络</title><desc id="desc">边上数字为分钟，A到E直达6；最小生成树总权7；最短巡回13。</desc><rect width="520" height="450" rx="12" fill="#f6f8fa"/><g font-family="Microsoft YaHei, sans-serif"><text x="22" y="33" fill="#173b55" font-size="23" font-weight="700">同一张图可以对应不同任务</text><path d="M65 195L195 70" stroke="#7895a5" stroke-width="2.5"/><rect x="118" y="116.5" width="24" height="27" rx="4" fill="white"/><text x="130" y="137.5" text-anchor="middle" font-size="20" fill="#173b55">2</text><path d="M65 195L215 335" stroke="#7895a5" stroke-width="2.5"/><rect x="128" y="249" width="24" height="27" rx="4" fill="white"/><text x="140" y="270" text-anchor="middle" font-size="20" fill="#173b55">5</text><path d="M195 70L215 335" stroke="#7895a5" stroke-width="2.5"/><rect x="193" y="186.5" width="24" height="27" rx="4" fill="white"/><text x="205" y="207.5" text-anchor="middle" font-size="20" fill="#173b55">1</text><path d="M195 70L365 150" stroke="#7895a5" stroke-width="2.5"/><rect x="268" y="94" width="24" height="27" rx="4" fill="white"/><text x="280" y="115" text-anchor="middle" font-size="20" fill="#173b55">4</text><path d="M215 335L365 150" stroke="#7895a5" stroke-width="2.5"/><rect x="278" y="226.5" width="24" height="27" rx="4" fill="white"/><text x="290" y="247.5" text-anchor="middle" font-size="20" fill="#173b55">1</text><path d="M215 335L455 335" stroke="#7895a5" stroke-width="2.5"/><rect x="323" y="319" width="24" height="27" rx="4" fill="white"/><text x="335" y="340" text-anchor="middle" font-size="20" fill="#173b55">5</text><path d="M365 150L455 335" stroke="#7895a5" stroke-width="2.5"/><rect x="398" y="226.5" width="24" height="27" rx="4" fill="white"/><text x="410" y="247.5" text-anchor="middle" font-size="20" fill="#173b55">3</text><path d="M65 195L455 335" stroke="#c05c3d" stroke-width="2.5"/><rect x="248" y="249" width="24" height="27" rx="4" fill="white"/><text x="260" y="270" text-anchor="middle" font-size="20" fill="#173b55">6</text><circle cx="65" cy="195" r="24" fill="#173b55"/><text x="65" y="203" text-anchor="middle" fill="white" font-size="23">A</text><circle cx="195" cy="70" r="24" fill="#173b55"/><text x="195" y="78" text-anchor="middle" fill="white" font-size="23">B</text><circle cx="215" cy="335" r="24" fill="#173b55"/><text x="215" y="343" text-anchor="middle" fill="white" font-size="23">C</text><circle cx="365" cy="150" r="24" fill="#173b55"/><text x="365" y="158" text-anchor="middle" fill="white" font-size="23">D</text><circle cx="455" cy="335" r="24" fill="#173b55"/><text x="455" y="343" text-anchor="middle" fill="white" font-size="23">E</text><text x="24" y="411" font-size="18" fill="#355260">边权为时间，不是图上的几何长度。</text></g></svg>