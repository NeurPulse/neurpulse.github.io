<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 609" role="img" aria-labelledby="title desc"><title id="title">预处理也属于训练</title><desc id="desc">每次交叉验证都重新保持这条边界。；训练折：fit：估计填补值、缩放参数与模型参数；验证折：transform 与评分：使用训练折已经确定的变换；选择模型和超参数：依据验证结果，保留最终测试；测试集：完成选择后评价：不能根据这次误差再挑参数</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#327080"/></marker></defs><rect width="520" height="609" fill="#f6f8fa" rx="16"/><g font-family="Microsoft YaHei, sans-serif"><text x="28" y="43" font-size="24" font-weight="700" fill="#173b55">预处理也属于训练</text><text x="28" y="76" font-size="17" fill="#466273">每次交叉验证都重新保持这条边界。</text><rect x="28" y="105" width="464" height="86" rx="10" fill="#fff" stroke="#bdd0d9"/><text x="48" y="137" font-size="22" font-weight="600" fill="#173b55">训练折：fit</text><text x="48" y="167" font-size="17" fill="#355260">估计填补值、缩放参数与模型参数</text><path d="M260 193V214" stroke="#327080" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="221" width="464" height="86" rx="10" fill="#e7f1f1" stroke="#bdd0d9"/><text x="48" y="253" font-size="22" font-weight="600" fill="#173b55">验证折：transform 与评分</text><text x="48" y="283" font-size="17" fill="#355260">使用训练折已经确定的变换</text><path d="M260 309V330" stroke="#327080" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="337" width="464" height="86" rx="10" fill="#fff" stroke="#bdd0d9"/><text x="48" y="369" font-size="22" font-weight="600" fill="#173b55">选择模型和超参数</text><text x="48" y="399" font-size="17" fill="#355260">依据验证结果，保留最终测试</text><path d="M260 425V446" stroke="#327080" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="453" width="464" height="86" rx="10" fill="#e7f1f1" stroke="#bdd0d9"/><text x="48" y="485" font-size="22" font-weight="600" fill="#173b55">测试集：完成选择后评价</text><text x="48" y="515" font-size="17" fill="#355260">不能根据这次误差再挑参数</text></g></svg>