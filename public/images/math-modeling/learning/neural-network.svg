<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 725" role="img" aria-labelledby="title desc"><title id="title">多层感知机的计算与训练</title><desc id="desc">每行一个样本，n 表示本批样本数。；输入 X：n × 13：13 个特征，训练集内完成缩放；隐藏 H：n × 16：H = ReLU(XW₁ + b₁)；分数 Z：n × 3：Z = HW₂ + b₂，每类一个分数；概率与损失：softmax 转概率，交叉熵比较标签；梯度与更新：反向求导，优化器更新；验证早停</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#327080"/></marker></defs><rect width="520" height="725" fill="#f6f8fa" rx="16"/><g font-family="Microsoft YaHei, sans-serif"><text x="28" y="43" font-size="24" font-weight="700" fill="#173b55">多层感知机的计算与训练</text><text x="28" y="76" font-size="17" fill="#466273">每行一个样本，n 表示本批样本数。</text><rect x="28" y="105" width="464" height="86" rx="10" fill="#fff" stroke="#bdd0d9"/><text x="48" y="137" font-size="22" font-weight="600" fill="#173b55">输入 X：n × 13</text><text x="48" y="167" font-size="17" fill="#355260">13 个特征，训练集内完成缩放</text><path d="M260 193V214" stroke="#327080" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="221" width="464" height="86" rx="10" fill="#e7f1f1" stroke="#bdd0d9"/><text x="48" y="253" font-size="22" font-weight="600" fill="#173b55">隐藏 H：n × 16</text><text x="48" y="283" font-size="17" fill="#355260">H = ReLU(XW₁ + b₁)</text><path d="M260 309V330" stroke="#327080" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="337" width="464" height="86" rx="10" fill="#fff" stroke="#bdd0d9"/><text x="48" y="369" font-size="22" font-weight="600" fill="#173b55">分数 Z：n × 3</text><text x="48" y="399" font-size="17" fill="#355260">Z = HW₂ + b₂，每类一个分数</text><path d="M260 425V446" stroke="#327080" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="453" width="464" height="86" rx="10" fill="#e7f1f1" stroke="#bdd0d9"/><text x="48" y="485" font-size="22" font-weight="600" fill="#173b55">概率与损失</text><text x="48" y="515" font-size="17" fill="#355260">softmax 转概率，交叉熵比较标签</text><path d="M260 541V562" stroke="#327080" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="569" width="464" height="86" rx="10" fill="#fff" stroke="#bdd0d9"/><text x="48" y="601" font-size="22" font-weight="600" fill="#173b55">梯度与更新</text><text x="48" y="631" font-size="17" fill="#355260">反向求导，优化器更新；验证早停</text></g></svg>