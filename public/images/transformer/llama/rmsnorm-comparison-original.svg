<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">LayerNorm 与 RMSNorm 对比</title>
  <desc id="desc">LayerNorm 同时去中心化和缩放，RMSNorm 只按均方根缩放。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#284462" flood-opacity="0.14"/></filter>
    <style>
      .title{font:700 40px system-ui,'Microsoft YaHei',sans-serif;fill:#172b4d}
      .subtitle{font:21px system-ui,'Microsoft YaHei',sans-serif;fill:#52677f}
      .head{font:700 29px system-ui,'Microsoft YaHei',sans-serif;fill:#173f75}
      .formula{font:27px 'Cambria Math','Times New Roman',serif;fill:#203750}
      .body{font:20px system-ui,'Microsoft YaHei',sans-serif;fill:#344b65}
      .tag{font:600 18px system-ui,'Microsoft YaHei',sans-serif;fill:#fff}
      .summary{font:600 21px system-ui,'Microsoft YaHei',sans-serif;fill:#234366}
    </style>
  </defs>
  <rect width="1400" height="650" rx="28" fill="#f7faff"/>
  <text x="70" y="72" class="title">LayerNorm 与 RMSNorm：差别不只是少算一个均值</text>
  <text x="70" y="110" class="subtitle">两者都控制表示的尺度；RMSNorm 保留均值，只执行均方根缩放。</text>

  <g filter="url(#shadow)">
    <rect x="70" y="160" width="590" height="370" rx="24" fill="#fff" stroke="#79a8e8" stroke-width="3"/>
    <rect x="740" y="160" width="590" height="370" rx="24" fill="#fff" stroke="#66b99a" stroke-width="3"/>
  </g>

  <text x="365" y="215" text-anchor="middle" class="head">LayerNorm</text>
  <text x="365" y="268" text-anchor="middle" class="formula">yᵢ = γᵢ · (xᵢ − μ) / √(σ² + ε) + βᵢ</text>
  <rect x="120" y="315" width="210" height="48" rx="24" fill="#4f87d8"/><text x="225" y="346" text-anchor="middle" class="tag">① 减去均值 μ</text>
  <rect x="400" y="315" width="210" height="48" rx="24" fill="#4f87d8"/><text x="505" y="346" text-anchor="middle" class="tag">② 除以标准差</text>
  <text x="365" y="410" text-anchor="middle" class="body">同时具备重新居中与重新缩放</text>
  <text x="365" y="447" text-anchor="middle" class="body">通常包含可学习参数 γ 和 β</text>
  <text x="365" y="484" text-anchor="middle" class="body">统计量依赖均值与方差</text>

  <text x="1035" y="215" text-anchor="middle" class="head">RMSNorm</text>
  <text x="1035" y="268" text-anchor="middle" class="formula">yᵢ = γᵢ · xᵢ / √(mean(x²) + ε)</text>
  <rect x="825" y="315" width="420" height="48" rx="24" fill="#3f9f7e"/><text x="1035" y="346" text-anchor="middle" class="tag">按均方根缩放，不减去均值</text>
  <text x="1035" y="410" text-anchor="middle" class="body">保留输入的均值信息</text>
  <text x="1035" y="447" text-anchor="middle" class="body">通常只保留可学习缩放参数 γ</text>
  <text x="1035" y="484" text-anchor="middle" class="body">计算路径更短，适合大模型反复调用</text>

  <rect x="130" y="568" width="1140" height="48" rx="14" fill="#e2ecfa"/>
  <text x="700" y="599" text-anchor="middle" class="summary">共同目标：稳定激活尺度；关键区别：LayerNorm“中心化 + 缩放”，RMSNorm“只缩放”。</text>
</svg>
