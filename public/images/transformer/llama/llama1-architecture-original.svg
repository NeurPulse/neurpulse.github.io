<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">LLaMA 1 模型数据流</title>
  <desc id="desc">输入经过分词与嵌入，进入多个解码器层，最后经归一化和线性层预测下一个 token。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#55708f"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#233b5c" flood-opacity="0.13"/></filter>
    <style>
      .title{font:700 40px system-ui,'Microsoft YaHei',sans-serif;fill:#172b4d}
      .subtitle{font:21px system-ui,'Microsoft YaHei',sans-serif;fill:#52677f}
      .head{font:700 25px system-ui,'Microsoft YaHei',sans-serif;fill:#173f75}
      .box{font:600 21px system-ui,'Microsoft YaHei',sans-serif;fill:#203750}
      .small{font:18px system-ui,'Microsoft YaHei',sans-serif;fill:#52677f}
      .arrow{stroke:#55708f;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="850" rx="28" fill="#f7faff"/>
  <text x="70" y="70" class="title">LLaMA 1：一个 token 如何流过模型</text>
  <text x="70" y="108" class="subtitle">核心是重复堆叠的 Pre-Norm Decoder Block；每个子层都由残差主路托底。</text>

  <g filter="url(#shadow)">
    <rect x="60" y="245" width="245" height="350" rx="22" fill="#fff" stroke="#8bc7b5" stroke-width="3"/>
    <rect x="385" y="150" width="620" height="560" rx="24" fill="#fff" stroke="#76a8ed" stroke-width="3"/>
    <rect x="1085" y="245" width="255" height="350" rx="22" fill="#fff" stroke="#f1b56c" stroke-width="3"/>
  </g>

  <text x="182" y="290" text-anchor="middle" class="head">输入阶段</text>
  <rect x="80" y="330" width="205" height="64" rx="14" fill="#e7f7f1" stroke="#43a98b" stroke-width="2"/><text x="182" y="371" text-anchor="middle" class="box">Tokenizer</text>
  <path d="M182 394v52" class="arrow"/>
  <rect x="80" y="452" width="205" height="64" rx="14" fill="#e7f7f1" stroke="#43a98b" stroke-width="2"/><text x="182" y="493" text-anchor="middle" class="box">Token Embedding</text>
  <text x="182" y="553" text-anchor="middle" class="small">得到序列表示 x</text>

  <text x="695" y="193" text-anchor="middle" class="head">Decoder Block × N</text>
  <rect x="445" y="225" width="500" height="64" rx="14" fill="#e8f0ff" stroke="#4a86e8" stroke-width="2"/><text x="695" y="266" text-anchor="middle" class="box">RMSNorm</text>
  <path d="M695 289v36" class="arrow"/>
  <rect x="445" y="325" width="500" height="92" rx="14" fill="#e8f0ff" stroke="#4a86e8" stroke-width="2"/>
  <text x="695" y="364" text-anchor="middle" class="box">因果多头自注意力</text><text x="695" y="394" text-anchor="middle" class="small">Q、K 使用 RoPE；Mask 阻止看到未来</text>
  <path d="M695 417v36" class="arrow"/>
  <rect x="520" y="453" width="350" height="55" rx="27" fill="#fff5db" stroke="#e6a93f" stroke-width="2"/><text x="695" y="488" text-anchor="middle" class="box">残差相加</text>
  <path d="M695 508v34" class="arrow"/>
  <rect x="445" y="542" width="500" height="64" rx="14" fill="#e8f0ff" stroke="#4a86e8" stroke-width="2"/><text x="695" y="583" text-anchor="middle" class="box">RMSNorm</text>
  <path d="M695 606v34" class="arrow"/>
  <rect x="445" y="640" width="500" height="64" rx="14" fill="#edf8ef" stroke="#59a96a" stroke-width="2"/><text x="695" y="681" text-anchor="middle" class="box">SwiGLU 前馈网络 + 残差</text>

  <path d="M305 484h72" class="arrow"/>
  <path d="M1005 484h72" class="arrow"/>

  <text x="1212" y="290" text-anchor="middle" class="head">输出阶段</text>
  <rect x="1120" y="330" width="185" height="64" rx="14" fill="#fff2e4" stroke="#e5933b" stroke-width="2"/><text x="1212" y="371" text-anchor="middle" class="box">RMSNorm</text>
  <path d="M1212 394v52" class="arrow"/>
  <rect x="1120" y="452" width="185" height="64" rx="14" fill="#fff2e4" stroke="#e5933b" stroke-width="2"/><text x="1212" y="493" text-anchor="middle" class="box">Linear → Logits</text>
  <text x="1212" y="553" text-anchor="middle" class="small">推理时选择下一 token</text>

  <rect x="125" y="760" width="1150" height="48" rx="14" fill="#e4edfb"/>
  <text x="700" y="792" text-anchor="middle" class="small">Pre-Norm 形式：x ← x + Attention(Norm(x))；x ← x + FFN(Norm(x))</text>
</svg>
