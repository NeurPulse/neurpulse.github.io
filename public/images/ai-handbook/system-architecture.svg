    <text x="868" y="234" fill="#273244" font-size="19">读取证据与问题</text><text x="868" y="261" fill="#273244" font-size="19">生成结构化结果</text></g><g><rect x="40" y="405" width="230" height="128" rx="12" fill="#edf4ff" stroke="#275a9b" stroke-width="2"/>
