<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" role="img" aria-labelledby="title desc">
  <title id="title">LSTM 单元总览</title>
  <desc id="desc">展示 LSTM 在一个时间步中如何使用遗忘门、输入门、候选记忆、输出门更新细胞状态和隐状态。</desc>
  <defs>
    <style>
      .bg{fill:#fbfcff}
      .panel{fill:#fff;stroke:#dbe4ef;stroke-width:2;rx:22}
      .gate{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:13}
      .cand{fill:#eefcf4;stroke:#22c55e;stroke-width:2;rx:13}
      .state{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2;rx:13}
      .core{fill:#eff6ff;stroke:#3b82f6;stroke-width:2;rx:13}
      .op{fill:#ffffff;stroke:#64748b;stroke-width:2}
      .title{font:700 25px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
      .label{font:700 17px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#24324a}
      .text{font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}
      .formula{font:15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#334155}
      .arrow{stroke:#64748b;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .cellline{stroke:#8b5cf6;stroke-width:4;fill:none;marker-end:url(#purpleArrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <rect class="bg" width="980" height="470" rx="26"/>
  <text class="title" x="42" y="54">LSTM 单元总览：两条状态流 + 三个门</text>
  <text class="text" x="42" y="84">上方的细胞状态 c 像一条“记忆通道”，下方的门决定忘掉什么、写入什么、输出什么。</text>

  <rect class="panel" x="42" y="120" width="896" height="305"/>

  <rect class="state" x="72" y="164" width="86" height="42"/>
  <text class="label" x="99" y="191">cₜ₋₁</text>
  <path class="cellline" d="M160 185 L820 185"/>
  <rect class="state" x="820" y="164" width="86" height="42"/>
  <text class="label" x="849" y="191">cₜ</text>

  <rect class="state" x="72" y="328" width="86" height="42"/>
  <text class="label" x="99" y="355">hₜ₋₁</text>
  <rect class="core" x="72" y="252" width="86" height="42"/>
  <text class="label" x="104" y="279">xₜ</text>

  <path class="arrow" d="M160 349 C225 349 225 260 290 260"/>
  <path class="arrow" d="M160 273 C225 273 225 260 290 260"/>
  <text class="text" x="188" y="318">拼接 [hₜ₋₁ | xₜ]</text>

  <rect class="gate" x="300" y="230" width="110" height="56"/>
  <text class="label" x="329" y="255">遗忘门</text>
  <text class="formula" x="335" y="277">fₜ</text>
  <path class="arrow" d="M355 230 L355 196"/>
  <circle class="op" cx="355" cy="185" r="15"/>
  <text class="label" x="350" y="191">×</text>

  <rect class="gate" x="450" y="230" width="110" height="56"/>
  <text class="label" x="479" y="255">输入门</text>
  <text class="formula" x="485" y="277">iₜ</text>
  <rect class="cand" x="595" y="230" width="110" height="56"/>
  <text class="label" x="622" y="255">候选记忆</text>
  <text class="formula" x="629" y="277">c̃ₜ</text>
  <path class="arrow" d="M505 230 L505 210"/>
  <path class="arrow" d="M650 230 L650 210"/>
  <circle class="op" cx="575" cy="185" r="15"/>
  <text class="label" x="570" y="191">×</text>
  <path class="arrow" d="M505 210 C520 198 545 190 560 187"/>
  <path class="arrow" d="M650 210 C632 198 604 190 590 187"/>

  <circle class="op" cx="715" cy="185" r="15"/>
  <text class="label" x="710" y="191">+</text>
  <path class="arrow" d="M590 185 L700 185"/>

  <rect class="gate" x="720" y="300" width="110" height="56"/>
  <text class="label" x="749" y="325">输出门</text>
  <text class="formula" x="755" y="347">oₜ</text>
  <path class="arrow" d="M775 300 L775 210"/>
  <circle class="op" cx="775" cy="255" r="15"/>
  <text class="label" x="770" y="261">×</text>
  <path class="arrow" d="M775 185 L775 240"/>

  <rect class="state" x="850" y="252" width="68" height="42"/>
  <text class="label" x="872" y="279">hₜ</text>
  <path class="arrow" d="M790 255 L846 273"/>

  <text class="text" x="300" y="402">一句话：fₜ 控制保留旧记忆，iₜ 和 c̃ₜ 控制写入新记忆，oₜ 控制从记忆中暴露多少为 hₜ。</text>
</svg>
