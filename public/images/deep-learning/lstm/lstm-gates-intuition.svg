<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">LSTM 三个门的直觉</title>
  <desc id="desc">用水阀门类比 LSTM 的遗忘门、输入门和输出门。</desc>
  <defs>
    <style>
      .bg{fill:#fbfcff}
      .card{fill:#fff;stroke:#dbe4ef;stroke-width:2;rx:22}
      .forget{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:15}
      .input{fill:#eefcf4;stroke:#22c55e;stroke-width:2;rx:15}
      .output{fill:#eff6ff;stroke:#3b82f6;stroke-width:2;rx:15}
      .state{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2;rx:14}
      .title{font:700 25px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
      .label{font:700 19px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#24324a}
      .text{font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}
      .formula{font:16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#334155}
      .arrow{stroke:#64748b;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" width="920" height="430" rx="26"/>
  <text class="title" x="42" y="54">三个门分别解决什么问题？</text>
  <text class="text" x="42" y="84">LSTM 的门不是“开/关”的硬开关，而是 0 到 1 之间的软选择。</text>

  <rect class="card" x="42" y="126" width="250" height="250"/>
  <rect class="forget" x="80" y="165" width="174" height="64"/>
  <text class="label" x="132" y="203">遗忘门 fₜ</text>
  <rect class="state" x="96" y="270" width="140" height="46"/>
  <text class="label" x="123" y="299">旧记忆 cₜ₋₁</text>
  <path class="arrow" d="M166 232 L166 266"/>
  <text class="text" x="74" y="346">决定旧记忆中哪些部分保留，哪些部分衰减。</text>

  <rect class="card" x="335" y="126" width="250" height="250"/>
  <rect class="input" x="373" y="165" width="174" height="64"/>
  <text class="label" x="425" y="203">输入门 iₜ</text>
  <rect class="state" x="390" y="270" width="140" height="46"/>
  <text class="label" x="411" y="299">候选记忆 c̃ₜ</text>
  <path class="arrow" d="M460 232 L460 266"/>
  <text class="text" x="367" y="346">决定新的候选信息中哪些值得写入细胞状态。</text>

  <rect class="card" x="628" y="126" width="250" height="250"/>
  <rect class="output" x="666" y="165" width="174" height="64"/>
  <text class="label" x="718" y="203">输出门 oₜ</text>
  <rect class="state" x="683" y="270" width="140" height="46"/>
  <text class="label" x="718" y="299">隐状态 hₜ</text>
  <path class="arrow" d="M753 232 L753 266"/>
  <text class="text" x="660" y="346">决定细胞状态中哪些内容暴露给当前输出。</text>

  <text class="formula" x="224" y="410">cₜ = fₜ ⊙ cₜ₋₁ + iₜ ⊙ c̃ₜ，    hₜ = oₜ ⊙ tanh(cₜ)</text>
</svg>
