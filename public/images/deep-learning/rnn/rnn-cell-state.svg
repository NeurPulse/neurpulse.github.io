<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">一个 RNN 时间步的内部计算</title>
  <desc id="desc">上一时刻隐状态和当前输入拼接后进入循环层，得到当前隐状态，再通过输出层得到当前输出。</desc>
  <defs>
    <style>
      .bg{fill:#fbfcff}
      .box{fill:#fff;stroke:#e2e8f0;stroke-width:2;rx:22}
      .state{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2;rx:14}
      .input{fill:#ecfdf5;stroke:#22c55e;stroke-width:2;rx:14}
      .core{fill:#eff6ff;stroke:#3b82f6;stroke-width:2.5;rx:18}
      .out{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:14}
      .title{font:700 25px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
      .label{font:700 18px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#24324a}
      .text{font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}
      .formula{font:16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#334155}
      .arrow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="920" height="420" rx="26"/>
  <text class="title" x="42" y="52">一个时间步里，RNN 到底算了什么？</text>
  <text class="text" x="42" y="82">当前输入不是单独被处理，而是和上一时刻的记忆一起决定新的记忆。</text>

  <rect class="box" x="42" y="118" width="836" height="250"/>

  <rect class="state" x="82" y="166" width="110" height="54"/>
  <text class="label" x="115" y="199">hₜ₋₁</text>
  <text class="text" x="92" y="240">历史记忆</text>

  <rect class="input" x="82" y="270" width="110" height="54"/>
  <text class="label" x="125" y="304">xₜ</text>
  <text class="text" x="96" y="348">当前输入</text>

  <rect class="core" x="300" y="214" width="210" height="82"/>
  <text class="label" x="345" y="248">循环层</text>
  <text class="formula" x="326" y="275">tanh([hₜ₋₁ | xₜ]Wₕ+bₕ)</text>

  <rect class="state" x="604" y="228" width="110" height="54"/>
  <text class="label" x="637" y="261">hₜ</text>
  <text class="text" x="614" y="305">新的记忆</text>

  <rect class="out" x="768" y="228" width="82" height="54"/>
  <text class="label" x="790" y="261">yₜ</text>
  <text class="text" x="760" y="305">当前输出</text>

  <path class="arrow" d="M194 193 C240 193 252 229 296 236"/>
  <path class="arrow" d="M194 297 C240 297 252 270 296 260"/>
  <path class="arrow" d="M512 255 L600 255"/>
  <path class="arrow" d="M716 255 L764 255"/>

  <text class="formula" x="542" y="152">hₜ = tanh([hₜ₋₁ | xₜ]Wₕ + bₕ)</text>
  <text class="formula" x="542" y="178">yₜ = softmax(hₜWᵧ + bᵧ)</text>
</svg>
