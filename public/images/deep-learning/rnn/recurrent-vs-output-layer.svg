<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">RNN 中循环层与普通输出层的区别</title>
  <desc id="desc">循环层负责更新隐状态并跨时间传递信息，普通输出层只在当前时间步使用隐状态进行预测。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #dbe4ef; stroke-width: 2; rx: 20; }
      .recur { fill: #eef7ff; stroke: #4f8ee8; stroke-width: 2.5; rx: 16; }
      .head { fill: #fff5e5; stroke: #f0a43a; stroke-width: 2.5; rx: 16; }
      .state { fill: #f3edff; stroke: #8b6ee8; stroke-width: 2; rx: 12; }
      .input { fill: #eefcf4; stroke: #45b36b; stroke-width: 2; rx: 12; }
      .title { font: 700 24px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .label { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #24324a; }
      .text { font: 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #536178; }
      .tiny { font: 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #536178; }
      .arrow { stroke: #718096; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #4f8ee8; stroke-width: 2.5; fill: none; marker-end: url(#blueArrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#718096" />
    </marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4f8ee8" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="430" rx="24" />
  <text class="title" x="44" y="56">循环层负责“记忆”，普通层负责“输出”</text>
  <text class="text" x="44" y="86">判断 RNN 的核心时，不要被输出层迷惑：真正跨时间递归调用的是隐状态更新层。</text>

  <rect class="panel" x="52" y="125" width="410" height="250" />
  <text class="label" x="82" y="164">循环层（核心）</text>
  <text class="text" x="82" y="194">输入当前 token 和上一时刻记忆</text>
  <rect class="state" x="82" y="235" width="88" height="42" />
  <text class="tiny" x="110" y="261">hₜ₋₁</text>
  <rect class="input" x="82" y="300" width="88" height="42" />
  <text class="tiny" x="116" y="326">xₜ</text>
  <rect class="recur" x="245" y="245" width="150" height="80" />
  <text class="label" x="278" y="280">RNN Cell</text>
  <text class="tiny" x="270" y="304">更新得到 hₜ</text>
  <path class="arrow" d="M173 256 L240 270" />
  <path class="arrow" d="M173 321 L240 300" />
  <path class="loop" d="M320 245 C320 205, 230 205, 230 250" />
  <text class="tiny" x="248" y="215">跨时间传递</text>

  <rect class="panel" x="520" y="125" width="410" height="250" />
  <text class="label" x="550" y="164">普通输出层（任务头）</text>
  <text class="text" x="550" y="194">只拿当前隐状态做分类或回归</text>
  <rect class="state" x="560" y="260" width="90" height="42" />
  <text class="tiny" x="591" y="286">hₜ</text>
  <rect class="head" x="715" y="245" width="140" height="72" />
  <text class="label" x="748" y="278">Softmax</text>
  <text class="tiny" x="750" y="300">得到 yₜ</text>
  <path class="arrow" d="M655 281 L710 281" />
  <path class="arrow" d="M858 281 L895 281" />
  <text class="tiny" x="870" y="265">标签概率</text>
  <text class="tiny" x="550" y="350">它可以替换成分类头、回归头或生成头，但不改变 RNN 的循环本质。</text>
</svg>
