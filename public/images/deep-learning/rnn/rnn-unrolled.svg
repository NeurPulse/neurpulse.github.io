<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="460" viewBox="0 0 1040 460" role="img" aria-labelledby="title desc">
  <title id="title">RNN 的时间展开结构</title>
  <desc id="desc">RNN 在每个时间步共享同一套参数，将上一时刻隐状态和当前输入一起计算当前隐状态。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #cbd8ea; stroke-width: 2; rx: 18; }
      .rnn { fill: #eef7ff; stroke: #4f8ee8; stroke-width: 2.5; rx: 18; }
      .input { fill: #eefcf4; stroke: #45b36b; stroke-width: 2; rx: 12; }
      .output { fill: #fff5e5; stroke: #f0a43a; stroke-width: 2; rx: 12; }
      .state { fill: #f3edff; stroke: #8b6ee8; stroke-width: 2; rx: 12; }
      .title { font: 700 24px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .label { font: 700 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #24324a; }
      .text { font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #536178; }
      .formula { font: 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #24324a; }
      .arrow { stroke: #718096; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .share { stroke: #e06969; stroke-width: 2; stroke-dasharray: 8 6; fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#718096" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1040" height="460" rx="24" />
  <text class="title" x="44" y="54">RNN 的时间展开：同一个循环层被重复调用</text>
  <text class="text" x="44" y="83">每一步都读入当前 token，同时接收上一时刻留下的隐状态。</text>

  <rect class="state" x="45" y="206" width="76" height="42" />
  <text class="label" x="67" y="232">h₀=0</text>

  <g transform="translate(165 130)">
    <rect class="input" x="28" y="0" width="84" height="42" />
    <text class="label" x="54" y="27">x₁</text>
    <rect class="rnn" x="0" y="92" width="140" height="82" />
    <text class="label" x="28" y="125">RNN Cell</text>
    <text class="text" x="34" y="150">共享参数</text>
    <rect class="output" x="28" y="226" width="84" height="42" />
    <text class="label" x="54" y="253">y₁</text>
    <path class="arrow" d="M70 43 L70 88" />
    <path class="arrow" d="M70 177 L70 222" />
  </g>

  <g transform="translate(405 130)">
    <rect class="input" x="28" y="0" width="84" height="42" />
    <text class="label" x="54" y="27">x₂</text>
    <rect class="rnn" x="0" y="92" width="140" height="82" />
    <text class="label" x="28" y="125">RNN Cell</text>
    <text class="text" x="34" y="150">共享参数</text>
    <rect class="output" x="28" y="226" width="84" height="42" />
    <text class="label" x="54" y="253">y₂</text>
    <path class="arrow" d="M70 43 L70 88" />
    <path class="arrow" d="M70 177 L70 222" />
  </g>

  <g transform="translate(645 130)">
    <rect class="input" x="28" y="0" width="84" height="42" />
    <text class="label" x="54" y="27">x₃</text>
    <rect class="rnn" x="0" y="92" width="140" height="82" />
    <text class="label" x="28" y="125">RNN Cell</text>
    <text class="text" x="34" y="150">共享参数</text>
    <rect class="output" x="28" y="226" width="84" height="42" />
    <text class="label" x="54" y="253">y₃</text>
    <path class="arrow" d="M70 43 L70 88" />
    <path class="arrow" d="M70 177 L70 222" />
  </g>

  <g transform="translate(885 130)">
    <rect class="input" x="28" y="0" width="84" height="42" />
    <text class="label" x="54" y="27">xₜ</text>
    <rect class="rnn" x="0" y="92" width="140" height="82" />
    <text class="label" x="28" y="125">RNN Cell</text>
    <text class="text" x="34" y="150">共享参数</text>
    <rect class="output" x="28" y="226" width="84" height="42" />
    <text class="label" x="54" y="253">yₜ</text>
    <path class="arrow" d="M70 43 L70 88" />
    <path class="arrow" d="M70 177 L70 222" />
  </g>

  <path class="arrow" d="M122 227 L160 227" />
  <path class="arrow" d="M305 227 L400 227" />
  <path class="arrow" d="M545 227 L640 227" />
  <path class="arrow" d="M785 227 L880 227" />
  <text class="text" x="328" y="214">h₁</text>
  <text class="text" x="568" y="214">h₂</text>
  <text class="text" x="808" y="214">h₃</text>

  <path class="share" d="M235 318 C360 395, 590 395, 715 318" />
  <text class="text" x="425" y="405">所有时间步使用同一套 Wₕ、bₕ、Wᵧ、bᵧ</text>

  <rect class="box" x="305" y="30" width="600" height="52" />
  <text class="formula" x="335" y="63">hₜ = tanh([hₜ₋₁ | xₜ]Wₕ + bₕ)    yₜ = softmax(hₜWᵧ + bᵧ)</text>
</svg>
