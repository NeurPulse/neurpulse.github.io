<svg xmlns="http://www.w3.org/2000/svg" width="464" height="408" viewBox="0 0 464 408" role="img" aria-labelledby="title desc" lang="zh-CN">
  <title id="title">一个 token 的 top-2 路由</title>
  <desc id="desc">路由器根据原向量选中专家 A 和 B。两个专家分别处理同一个原向量，再按路由器给出的权重相加，得到这个 token 的输出向量。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path class="arrowhead" d="M0.5 0.5 7.5 4 0.5 7.5Z"/>
    </marker>
  </defs>
  <style>
    .canvas { fill: #ffffff; }
    .node { fill: #f5f7fa; stroke: #738398; stroke-width: 1.3; }
    .expert { fill: #e9f3f1; stroke: #577f76; }
    .edge { fill: none; stroke: #556677; stroke-width: 1.7; stroke-linejoin: round; marker-end: url(#arrow); }
    .arrowhead { fill: #556677; }
    text { fill: #172b3c; text-anchor: middle; font-family: system-ui, "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 18px; }
    .label { font-size: 15.5px; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #18212c; }
      .node { fill: #243240; stroke: #8396ab; }
      .expert { fill: #1e3937; stroke: #84b4a9; }
      .edge { stroke: #aabcca; }
      .arrowhead { fill: #aabcca; }
      text { fill: #eef5fa; }
    }
  </style>
  <rect class="canvas" width="464" height="408" rx="8"/>
  <g>
    <path class="edge" d="M232 54V68H80V89"/>
    <path class="edge" d="M232 68H329V89"/>
    <path class="edge" d="M148 117H244"/>
    <path class="edge" d="M329 141V167H260V190"/>
    <path class="edge" d="M329 167H398V190"/>
    <path class="edge" d="M260 236V254H293V273"/>
    <path class="edge" d="M398 236V254H365V273"/>
    <path class="edge" d="M80 141V300H243"/>
    <path class="edge" d="M329 325V350"/>
  </g>
  <g>
    <rect class="node" x="143" y="8" width="178" height="46" rx="8"/>
    <text x="232" y="37">一个 token 的向量 x</text>
    <rect class="node" x="12" y="91" width="136" height="50" rx="8"/>
    <text x="80" y="122">路由器打分</text>
    <rect class="node" x="246" y="91" width="166" height="50" rx="8"/>
    <text x="329" y="122">分发原向量 x</text>
    <rect class="node expert" x="208" y="192" width="104" height="44" rx="8"/>
    <text x="260" y="220">专家 A</text>
    <rect class="node expert" x="346" y="192" width="104" height="44" rx="8"/>
    <text x="398" y="220">专家 B</text>
    <rect class="node" x="245" y="275" width="168" height="50" rx="8"/>
    <text x="329" y="306">按权重相加</text>
    <rect class="node" x="214" y="352" width="230" height="46" rx="8"/>
    <text x="329" y="381">这个 token 的输出向量</text>
  </g>
  <text class="label" x="197" y="107">选中 A、B</text>
  <text class="label" x="132" y="221">A、B 的权重</text>
</svg>
